# Application Angular (SPA). HTTPS et routage de l'API sont faits en amont (Caddy).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Fichiers avec empreinte (main-XXXX.js...) : cache long
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpe?g|gif|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html jamais mis en cache : un nouveau déploiement est visible tout de suite
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
