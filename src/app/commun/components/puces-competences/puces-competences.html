<div class="puces">
  <label [attr.for]="id">{{ libelle() }}</label>
  <ul>
    @for (c of valeur(); track c) {
      <li>
        {{ c }}
        @if (!lectureSeule() && !desactive()) {
          <button type="button" [attr.aria-label]="'Retirer ' + c" (click)="retirer(c)">×</button>
        }
      </li>
    } @empty {
      <li class="vide">{{ texteVide() }}</li>
    }
  </ul>
  @if (!lectureSeule()) {
    <input #champ [id]="id" type="text" [placeholder]="placeholder()" [disabled]="desactive()"
      (keydown)="touche($event, champ)" (blur)="valider(champ); contact()" />
  }
</div>
