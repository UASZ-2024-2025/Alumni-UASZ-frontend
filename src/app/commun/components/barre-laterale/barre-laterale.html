<aside class="barre">
  <div class="logo">
    <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="19" />
      <path d="M10 11v12a10 10 0 0 0 20 0V11h-5v12a5 5 0 0 1-10 0V11z" />
    </svg>
    <span>UASZ<small>Université Assane Seck de Ziguinchor</small></span>
  </div>

  <nav aria-label="Navigation principale">
    @for (e of elements(); track e.chemin) {
      <a [routerLink]="e.chemin" routerLinkActive="actif">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path [attr.d]="icone(e.chemin)" />
        </svg>
        {{ e.libelle }}
      </a>
    }
  </nav>

  <div class="bas">
    @if (menuOuvert()) {
      <div class="menu" role="menu">
        <button type="button" role="menuitem" class="deconnexion" (click)="menuOuvert.set(false); deconnexion.emit()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 2.5H3.5v11H6M10 5l3 3-3 3M13 8H6" />
          </svg>
          Déconnexion
        </button>
      </div>
    }
    <button type="button" class="utilisateur" aria-haspopup="menu" [attr.aria-expanded]="menuOuvert()"
      (click)="menuOuvert.set(!menuOuvert())">
      <span class="avatar">{{ initiale() }}</span>
      <span class="identite"><b>{{ nom() }}</b><small>{{ role() }}</small></span>
      <svg class="chevron" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 10l4-4 4 4" />
      </svg>
    </button>
  </div>
</aside>
