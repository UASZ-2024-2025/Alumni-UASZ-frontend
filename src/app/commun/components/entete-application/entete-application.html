<header class="entete">
  <button type="button" class="burger" aria-label="Ouvrir le menu" (click)="menu.emit()">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" /></svg>
  </button>
  <input type="search" placeholder="Rechercher…" aria-label="Rechercher" />
  <div class="droite">
    <a routerLink="/notifications" class="cloche" aria-label="Notifications">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 2a4 4 0 00-4 4c0 4-2 5-2 5h12s-2-1-2-5a4 4 0 00-4-4zM6.5 13.5a1.5 1.5 0 003 0" />
      </svg>
      <i></i>
    </a>
    <span class="role">{{ role() }}</span>
    <span class="avatar" aria-hidden="true">{{ initiale() }}</span>
  </div>
</header>
