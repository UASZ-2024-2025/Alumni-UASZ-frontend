<div class="logo" [class.logo--clair]="variante() === 'clair'" [class.logo--fonce]="variante() === 'fonce'">
  @if (!imageIndisponible()) {
    <img class="logo-image" [src]="source()" alt="" width="46" height="46" (error)="imageIndisponible.set(true)" />
  } @else {
    <svg width="42" height="42" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="19" />
      <path d="M10 11v12a10 10 0 0 0 20 0V11h-5v12a5 5 0 0 1-10 0V11z" />
    </svg>
  }
  <span>UASZ<small>Université Assane Seck de Ziguinchor</small></span>
</div>
