<nav class="pagination" aria-label="Pagination">
  <app-bouton variante="secondaire" [desactive]="page() <= 0" (clic)="changement.emit(page() - 1)">Précédent</app-bouton>
  <span>Page {{ page() + 1 }} / {{ nbPages() }}</span>
  <app-bouton variante="secondaire" [desactive]="page() + 1 >= nbPages()" (clic)="changement.emit(page() + 1)">Suivant</app-bouton>
</nav>
