<div class="champ">
  <label [attr.for]="id" [class.cache]="libelleCache()">{{ libelle() }}@if (requis()) { <span aria-hidden="true"> *</span> }</label>
  @switch (type()) {
    @case ('textarea') {
      <textarea [id]="id" [attr.autocomplete]="autocomplete()" [rows]="lignes()" [value]="valeur()" [placeholder]="placeholder()" [attr.maxlength]="longueurMax()" [disabled]="desactive()"
        [attr.aria-invalid]="erreur() ? true : null" [attr.aria-describedby]="erreur() ? id + '-err' : null"
        (input)="saisie($any($event.target).value)" (blur)="contact()"></textarea>
    }
    @case ('select') {
      <select [id]="id" [attr.autocomplete]="autocomplete()" [disabled]="desactive()" [attr.aria-invalid]="erreur() ? true : null"
        (change)="saisie($any($event.target).value)" (blur)="contact()">
        @for (o of options(); track o.valeur) {
          <option [value]="o.valeur" [selected]="o.valeur === valeur()">{{ o.libelle }}</option>
        }
      </select>
    }
    @default {
      <input [id]="id" [attr.autocomplete]="autocomplete()" [type]="type()" [attr.list]="suggestions().length ? id + '-sug' : null" [value]="valeur()" [placeholder]="placeholder()" [attr.maxlength]="longueurMax()" [disabled]="desactive()"
        [attr.aria-invalid]="erreur() ? true : null" [attr.aria-describedby]="erreur() ? id + '-err' : null"
        (input)="saisie($any($event.target).value)" (blur)="contact()" />
      @if (suggestions().length) {
        <datalist [id]="id + '-sug'">
          @for (s of suggestions(); track s) { <option [value]="s"></option> }
        </datalist>
      }
    }
  }
  @if (erreur(); as message) {
    <span class="erreur" [id]="id + '-err'">{{ message }}</span>
  }
</div>
